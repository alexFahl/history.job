<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>History.job Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header avec le Logo SVG -->
    <div class="header">
      <img src="icons/HJ_basic.svg" alt="History.job Logo" class="logo" />
      <h2>History.job</h2>
    </div>

    <!-- Login Section -->
    <div id="login-section">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button id="login-btn">Log In</button>
      <div id="login-message" class="error-msg"></div>
    </div>

    <!-- App Section (Logged In) -->
    <div id="app-section" style="display: none">
      <p class="user-info">Logged in as <strong id="user-display"></strong></p>
      <hr />

      <!-- Job Clipper Form -->
      <div id="clipper-section">
        <label>Target Profile</label>
        <select id="profile-select">
          <option value="" disabled selected>Loading profiles...</option>
        </select>

        <button id="analyze-btn" style="margin-top: 5px; margin-bottom: 5px">
          Analyze offer
        </button>
        <div id="action-message"></div>

        <!-- Loader -->
        <div id="loader" style="display: none">
          <div class="spinner"></div>
          <p>AI analyzing the page...</p>
          <button
            id="cancel-analysis-btn"
            type="button"
            class="btn-small-outline"
          >
            Cancel
          </button>
        </div>

        <!-- Fields -->
        <div id="form-fields" style="display: none">
          <label>Company</label>
          <input type="text" id="company-name" placeholder="ex: Renault" />

          <label>Job Title</label>
          <input
            type="text"
            id="job-title"
            placeholder="ex: Frontend Developer"
          />

          <label>Location</label>
          <input type="text" id="location" placeholder="ex: Paris, France" />

          <label>Job Ad URL</label>
          <input type="url" id="job-ad-url" placeholder="https://..." />

          <div class="grid-2">
            <div>
              <label>Salary Expected</label>
              <div class="flex-row">
                <input
                  type="text"
                  id="salary-expected"
                  placeholder="ex: 55000"
                />
                <input
                  type="text"
                  id="currency"
                  value="€"
                  class="currency-input"
                  placeholder="€"
                />
              </div>
            </div>
            <div>
              <label>Applied on</label>
              <input type="date" id="applied-date" />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Job Type</label>
              <select id="job-type">
                <option value="">None</option>
                <option value="C">City</option>
                <option value="H">Hybrid</option>
                <option value="R">Remote</option>
              </select>
            </div>
            <div>
              <label>Status</label>
              <select id="status">
                <option value="T">To Apply</option>
                <option value="A">Applied</option>
                <option value="I">Interviewing</option>
                <option value="R">Rejected</option>
                <option value="O">Offer</option>
              </select>
            </div>
          </div>

          <label>Description</label>
          <textarea
            id="description"
            rows="6"
            placeholder="Job description will appear here..."
          ></textarea>

          <div class="action-buttons">
            <button id="cancel-offer-btn" type="button">Cancel</button>
            <button id="add-offer-btn" disabled>Add offer</button>
          </div>
          <div id="save-message"></div>
        </div>
      </div>

      <button id="logout-btn">Log Out</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
